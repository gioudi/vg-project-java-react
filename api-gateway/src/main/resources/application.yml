server:
  port: 8000

spring:
  application:
    name: api-gateway
  cloud:
   gateway:
    routes:
    #Route for the Search Microservice
     - id: search-service-route
       uri: lb://GAME-SEARCH-SERVICE
       predicates:
        - Path=/api/v1/search/**

    #Route for the Inventory Microservice
     - id: inventory-service-route
       uri: lb://GAME-INVENTORY-SERVICE
       predicates:
        - Path=/api/v1/inventory/**


eureka:
  instance:
    prefer-ip-address: true

  client:
    http-client-adapter: rest-template
    fetch-registry: true
    register-with-eureka: true
    service-url:
      defaultZone: http://localhost:8761/eureka/